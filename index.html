<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election night 2026: every race vs our model</title>
<style>
:root {
  --bg: #0c1016; --panel: #131922; --panel2: #18202b; --line: #232c39; --line2: #2f3a4a;
  --text: #e7ebf1; --muted: #8e99aa; --faint: #5d687a; --dem: #4a90e8; --rep: #e8665f;
  --mono: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.42 var(--sans); font-variant-numeric: tabular-nums; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
h1 { font-size: 18px; margin: 0 6px 0 0; }
.liveb { font: 700 11px var(--mono); letter-spacing: .08em; color: #ff8a80; border: 1px solid #a33a33; background: #2a1414; border-radius: 4px; padding: 1px 7px; }
.liveb.stale { color: #f0b35a; border-color: #8a6420; background: #2a2010; }
.agec { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px; }
.agec b { color: var(--text); font-weight: 600; }
.row2 { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.row2 .sep { width: 1px; height: 22px; background: var(--line2); }
.alert { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid #8f7ae6; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
.alert .lab { font: 700 11px var(--mono); letter-spacing: .08em; color: #b9a8f5; padding-top: 2px; }
.alert.flipa { border-left-color: #f3c46b; } .alert.flipa .lab { color: #f3c46b; }
.alert .items { max-height: 92px; overflow-y: auto; line-height: 1.6; }
.alert a { color: var(--text); text-decoration: underline dotted; cursor: pointer; }
#cboard { margin-bottom: 10px; }
#cboard .board { max-height: 360px; overflow-y: auto; }
#cboard .board thead th { position: sticky; top: -10px; background: var(--panel2); z-index: 1; }
.chips { display: flex; gap: 6px; }
button, select, input { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; font: inherit; }
button { cursor: pointer; }
button[aria-pressed="true"] { background: #2a3550; border-color: #5a6a8a; }
input { width: 150px; }
.spacer { flex: 1; }
.note { color: var(--muted); font-size: 12.5px; }
.status { font: 12px var(--mono); color: var(--muted); }
.status b { color: var(--text); font-weight: 500; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 0; }
.summary div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
.summary b { font: 600 15px var(--mono); color: var(--text); margin-left: 4px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 580px; gap: 10px; padding: 8px 16px 10px; }
#deckmap { position: relative; height: calc(100vh - 170px); min-height: 520px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #151c27, #0a0d12); }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-y: auto; max-height: calc(100vh - 170px); min-height: 520px; font-size: 12.5px; display: grid; gap: 10px; align-content: start; }
aside h3 { margin: 0; font-size: 15px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv span { color: var(--muted); }
.kv b { font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-align: right; }
.kv .gap { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 3px 0 1px; }
.pos { color: var(--dem) !important; } .neg { color: var(--rep) !important; }
.cbar { height: 6px; background: #2a3342; border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
.cbar i { display: block; height: 100%; background: #c9d1dc; }
.detail { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
.detail .x { float: right; padding: 0 7px; }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
th { color: var(--faint); font-weight: 500; text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; position: sticky; top: -10px; background: var(--panel); }
th[aria-sort] { color: var(--text); }
td { font-family: var(--mono); text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.nm { font-family: var(--sans); color: var(--muted); text-align: left; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
tbody tr { cursor: pointer; }
tbody tr:hover td, tbody tr.sel td { background: #1a2230; }
.board { background: var(--panel2); border: 1px solid #2c5a3c; border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
.board h4 { margin: 0; font-size: 14px; } .board h4 small { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 6px; }
.board table td { white-space: normal; }
.board td.buy { max-width: 250px; }
.board th, .board td { padding: 2px 3px; }
.board .buy b { font-family: var(--sans); font-weight: 600; }
.board .why { font-family: var(--sans); font-size: 11px; color: var(--muted); }
.board .why.warn { color: #f0b35a; }
.flipb { font-family: var(--sans); font-size: 10.5px; font-weight: 700; color: #1a1205; background: #f3c46b; border-radius: 3px; padding: 0 5px; margin-left: 4px; }
.kfoot { color: var(--faint); font-size: 11px; }
.called { font-family: var(--sans); font-size: 10.5px; padding: 0 4px; border-radius: 3px; border: 1px solid currentColor; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 0 16px 12px; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.ctip { font: 12.5px/1.45 var(--sans); }
.ctip h5 { margin: 0; font-size: 14px; }
.ctip .sub { color: var(--muted); margin-bottom: 4px; }
.fine { color: var(--faint); font-size: 11.5px; }
.err { color: #f0b35a; }
.wchart { width: 100%; height: auto; display: block; }
.wchart text { fill: var(--faint); font: 10px var(--sans); }
.clegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.clegend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
details summary { cursor: pointer; color: var(--muted); }
.views { display: flex; gap: 6px; align-items: center; }
#cardsview { padding: 8px 16px 14px; }
#cardsview[hidden], main[hidden], .legend[hidden] { display: none; }
.ctools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.rc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; display: grid; gap: 6px; cursor: pointer; align-content: start; }
.rc:hover { border-color: var(--line2); }
.rc.flipc { border-color: #a8741f; box-shadow: 0 0 0 1px #a8741f inset; }
.rc.edgec { border-color: #2c5a3c; }
.rc .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc .top b { font-size: 15px; }
.chip { font: 600 10.5px var(--mono); letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.live { color: #e7ebf1; } .chip.done { color: #6fd39a; border-color: #2c5a3c; } .chip.callD { color: var(--dem); border-color: var(--dem); } .chip.callR { color: var(--rep); border-color: var(--rep); }
.rc .names { display: flex; justify-content: space-between; font-size: 13px; }
.rc .big2 { display: flex; justify-content: space-between; align-items: end; }
.rc .big2 small { display: block; color: var(--muted); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.rc .big2 b { font: 600 21px var(--mono); }
.rc .big2 .r { text-align: right; }
.rc .sub2 { display: flex; justify-content: space-between; color: var(--faint); font-size: 11.5px; margin-top: -4px; }
.rc .kv2 { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; font-size: 12px; }
.rc .kv2 span { color: var(--muted); } .rc .kv2 b { font: 500 12px var(--mono); text-align: right; }
.rc .kbox { background: #10151d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; display: grid; gap: 3px; }
.rc .kbox .row { display: flex; justify-content: space-between; gap: 8px; }
.rc .kbox .row b { font-family: var(--mono); font-weight: 500; }
.rc .buyl { border-left: 3px solid #2c8a52; padding-left: 7px; }
.rc .buyl.flipl { border-color: #f3c46b; }
.rc .tag { font-size: 11px; color: #f0b35a; }
.outl { font-size: 11.5px; color: var(--muted); display: grid; gap: 1px; }
.outl b { color: var(--text); font-weight: 600; }
.outl .h { color: var(--faint); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.rc .ovr { background: #10151d; border-left: 3px solid var(--line2); padding: 4px 8px; font-size: 12px; color: var(--muted); border-radius: 0 4px 4px 0; }
.rc svg text { fill: var(--faint); font: 10px var(--sans); }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } aside { max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>Election Night · House desk</h1>
  <span class="liveb" id="liveb">LIVE</span>
  <span class="agec" id="agec">NYT –</span>
  <span class="agec" id="agek">Kalshi –</span>
  <div class="spacer"></div>
  <a href="review.html" class="note" style="color:#8fbdf2">Night in review</a>
  <div class="status" id="status">loading…</div>
  <div class="row2">
  <div class="chips" id="views"></div>
  <span class="sep"></span>
  <div class="chips" id="offices"></div>
  <label class="note" for="metric">Color &amp; columns</label>
  <select id="metric">
    <option value="sh">Projection shift (projected − model)</option>
    <option value="ou">Over/under (count read − model)</option>
    <option value="p">Our chance</option>
    <option value="ke">Kalshi edge (House)</option>
  </select>
  <select id="filter" aria-label="Which races">
    <option value="all">All races</option>
    <option value="close">Close (model 10–90%)</option>
    <option value="counting">Counting</option>
    <option value="uncalled">Not called</option>
  </select>
  <input id="q" type="search" placeholder="Find race or name" aria-label="Find a race">
  <label class="note"><input type="checkbox" id="board" checked style="width:auto;vertical-align:-2px"> Kalshi board</label>
  </div>
</header>
<div class="summary" id="summary"></div>
<section id="cardsview" hidden>
  <div id="alerts"></div>
  <div id="cboard"></div>
  <div class="ctools">
    <label class="note" for="csort">Sort cards</label>
    <select id="csort">
      <option value="edge">Kalshi edge (biggest first)</option>
      <option value="flip">FLIPs first, then edge</option>
      <option value="close">Closest projection</option>
      <option value="pct">Most counted</option>
      <option value="sh">Biggest shift vs model</option>
    </select>
    <span class="note" id="cnote"></span>
  </div>
  <div class="cgrid" id="cgrid"></div>
</section>
<main>
  <div id="deckmap" aria-label="3D map: every race against our model"></div>
  <aside id="side"></aside>
</main>
<div class="legend" id="legend"></div>
<script src="house_bench.js"></script>
<script src="house_geo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@8.9.35/dist.min.js"></script>
<script>
"use strict";
/* Every House, Senate and Governor race, separate from the data desk. live.json / hist.json come from the branch
   `live`, written every 60 s by night.py in GitHub Actions from NYT's 50 state pages: each race's count, the desk's
   v0 projection started from our margin model, and the over/under. No markets (a separate thing). */
const REPO = "pjmerica/house-night-2026";
const LOCAL = new URLSearchParams(location.search).has("local");
const RAW = f => LOCAL ? f : `https://raw.githubusercontent.com/${REPO}/live/${f}`;
const API = f => `https://api.github.com/repos/${REPO}/contents/${f}?ref=live`;
const B = window.HOUSE_BENCH, G = window.HOUSE_GEO;
const BY = Object.fromEntries(B.races.map(r => [r.id, r]));
const C_D = [74, 144, 232], C_R = [232, 102, 95], FULL = { sh: 8, ou: 15, ke: 20 };
const OFF = { H: "House", S: "Senate", G: "Governor" };
const ui = { view: "cards", csort: "edge", board: true, bsort: "edge", bdir: -1, office: "H", metric: "sh", filter: "all", q: "", sel: null, sort: "default", dir: 1, hover: null };
let LIVE = null, HIST = {}, DECK = null, FIT = null, lastErr = null, apiAt = 0, apiOff = 0, histAt = 0;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtInt = n => Math.round(n || 0).toLocaleString("en-US");
const etTime = d => d.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }) + " ET";
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const short = r => r.office === "H" ? r.k : r.k.replace("-S", " (special)") + " " + OFF[r.office];
function lead(m, r) { return m == null ? "–" : Math.abs(m) < 0.05 ? "tied" : `${m > 0 ? (r.dl || "D") : (r.rl || "R")} +${Math.abs(m).toFixed(1)}`; }
const sgn = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const pc = p => p == null ? "–" : (100 * p).toFixed(p > 0.995 || p < 0.005 ? 1 : 0) + "%";

// ---------- data ----------
const genOf = j => j ? Date.parse(j.generated) || 0 : 0;
async function getJson(f, wantFresh) {
  let j = null;
  try { const r = await fetch(RAW(f) + (LOCAL ? "" : "?t=" + Date.now()), { cache: "no-store" }); if (r.ok) j = await r.json(); } catch (e) { /* the API next */ }
  if (!LOCAL && wantFresh && (!j || Date.now() - genOf(j) > 120000) && Date.now() > apiOff && Date.now() - apiAt > 110000) {
    apiAt = Date.now();
    try {
      const r = await fetch(API(f), { headers: { Accept: "application/vnd.github.raw" }, cache: "no-cache" });
      if (r.status === 403 || r.status === 429) apiOff = Date.now() + 600000;
      if (r.ok) { const a = await r.json(); if (!j || genOf(a) > genOf(j)) j = a; }
    } catch (e) { /* keep raw's copy */ }
  }
  return j;
}
async function refresh() {
  const j = await getJson("live.json", true);
  if (j && genOf(j) >= genOf(LIVE)) { LIVE = j; lastErr = null; } else if (!j) lastErr = "couldn't load live.json";
  if (Date.now() - histAt > 120000) { const h = await getJson("hist.json", false); if (h) { HIST = h; histAt = Date.now(); } }
  render(false);
}

function visible(rs) {
  const q = ui.q.trim().toLowerCase();
  return rs.filter(r => {
    if (ui.filter === "close" && !(r.win != null && r.win >= 0.1 && r.win <= 0.9)) return false;
    if (ui.filter === "counting" && !(r.L.v > 0)) return false;
    if (ui.filter === "uncalled" && r.L.call) return false;
    if (q && !(r.k.toLowerCase().includes(q) || (r.d || "").toLowerCase().includes(q) || (r.r || "").toLowerCase().includes(q))) return false;
    return true;
  });
}
// ke: the best Kalshi edge in cents, + when the buy is the Democrat / non-Republican, - when it's the Republican
const kedge = r => r.L.best ? 100 * r.L.best.edge * (r.L.best.side === "D" ? 1 : -1) : null;
const metricOf = r => ui.metric === "p" ? (r.L.p == null ? null : 100 * (r.L.p - 0.5)) : ui.metric === "ke" ? kedge(r) : r.L[ui.metric];
const cents = p => p == null ? "–" : (Math.abs(100 * p - Math.round(100 * p)) > 0.05 ? (100 * p).toFixed(1) : (100 * p).toFixed(0)) + "¢";
const sideName = (r, s) => s === "D" ? r.dl : r.rl;
function whyTags(r) {
  const b = r.L.best, out = [];
  if (!b) return out;
  if (b.flip) out.push(["", "FLIP (the desk's rule): the count leads this side by 1+ pt, our chance 45%+, ask 8–40¢"]);
  if (b.against) out.push(["warn", "against the count: this edge is our pre-election model arguing with a market that sees the votes"]);
  if (!r.L.pct) out.push(["warn", "not counting yet: our model vs the market"]);
  else if (r.L.c != null && Math.abs(r.L.c) < 1 && !b.against) out.push(["warn", "count too close to read: this edge is mostly our pre-election model"]);
  else if (!b.flip && !b.against && b.ask < 0.4 && b.ours < 0.45) out.push(["warn", "not a FLIP: longshots like this lost in 2024"]);
  if (b.ask < 0.08 && r.L.pct >= 20) out.push(["warn", r.L.src === "v1" ? "market near-certain: check the live count" : "market near-certain: it may see which counties are still out"]);
  if (r.L.pct && r.L.src !== "v1") out.push(["warn", "district total only: no county detail for this race"]);
  return out;
}

// ---------- shapes ----------
function centroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length; i++) { const [x0, y0] = ring[i], [x1, y1] = ring[(i + 1) % ring.length], f = x0 * y1 - x1 * y0; a += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f; }
  return a ? [cx / (3 * a), cy / (3 * a)] : ring[0];
}
const STATE_C = Object.fromEntries(Object.entries(G.states).map(([k, rs]) => [k, centroid(rs.reduce((m, r) => r.length > m.length ? r : m, rs[0]))]));
const shapeOf = r => r.office === "H" ? (G.districts[r.k] || {}).rings || [] : G.states[r.st] || [];
const posOf = r => {
  if (r.office === "H") return (G.districts[r.k] || {}).c;
  const c = STATE_C[r.st]; return c && r.special ? [c[0] + 9, c[1] - 9] : c;     // a special beside the regular race
};
function bbox(rings) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const ring of rings) for (const [x, y] of ring) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return [x0, y0, x1, y1];
}
function viewFor(rings, tilt) {
  const [x0, y0, x1, y1] = bbox(rings), el = document.getElementById("deckmap"), w = Math.max(x1 - x0, 6), h = Math.max(y1 - y0, 6);
  const pad = w < 100 ? 2.2 : 1.25, zoom = Math.log2(Math.min(el.clientWidth / (w * pad), el.clientHeight / (h * pad * 1.2)));
  return { target: [(x0 + x1) / 2, (y0 + y1) / 2 + h * 0.05, 0], zoom, rotationX: tilt, rotationOrbit: -8, size: Math.max(w, h) };
}
const ALL_RINGS = Object.values(G.states).flat();

// ---------- color ----------
function fill(r) {
  if (r.kind !== "ok" && r.kind !== "jungle") return [40, 46, 58, 200];
  const v = metricOf(r);
  if (v == null) return [34, 41, 52, 235];
  const full = ui.metric === "p" ? 50 : FULL[ui.metric];
  const t = Math.max(-1, Math.min(1, v / full)), k = Math.sqrt(Math.abs(t)), base = [64, 70, 84], tgt = t > 0 ? C_D : C_R;
  const pct = r.L.pct || 0, a = Math.round(255 * Math.min(1, 0.4 + 0.6 * pct / 90));
  return [0, 1, 2].map(i => Math.round(base[i] + (tgt[i] - base[i]) * k)).concat([a]);
}

// ---------- cards ----------
function card(r, full) {
  const L = r.L, two = (L.dv || 0) + (L.rv || 0);
  let h = `<h5>${esc(short(r))}${L.call ? ` <span class="called ${L.call === "D" ? "pos" : L.call === "R" ? "neg" : ""}">called: ${esc(L.call === "D" ? r.dl : L.call === "R" ? r.rl : L.call)}</span>` : ""}</h5>`;
  h += `<div class="sub">${esc(r.d || "–")} (${esc((r.dp || "").slice(0, 3))}) vs ${esc(r.r || "–")} (REP)${r.kind === "jungle" ? " · Louisiana's Nov 3 round: a runoff Dec 12 if nobody passes 50%" : r.kind === "same-party" ? " · same-party race: no projection" : r.kind === "uncontested" ? " · uncontested" : ""}${L.rc ? " · ranked-choice race: first choices of each side's leading candidate, later rounds can change the result" : ""}</div>`;
  h += `<div class="kv"><span>Counted</span><b>${L.pct == null ? "not reporting" : L.pct.toFixed(0) + "% · " + fmtInt(L.v) + " votes"}</b></div>`;
  if (L.pct != null) h += `<div class="cbar"><i style="width:${Math.min(100, L.pct)}%"></i></div>`;
  h += `<div class="kv">`;
  if (two) h += `<span>${esc(r.dl)}</span><b>${fmtInt(L.dv)} · ${(100 * L.dv / L.v).toFixed(1)}%</b><span>${esc(r.rl)}</span><b>${fmtInt(L.rv)} · ${(100 * L.rv / L.v).toFixed(1)}%</b>`;
  if (r.kind === "jungle" && L.lead) h += `<span>Leading</span><b>${esc(L.lead)}</b>`;
  h += `<span>Margin so far</span><b class="${cls(L.m)}">${lead(L.m, r)}</b><i class="gap"></i>`;
  h += `<span>Our model (before the count)</span><b class="${cls(r.m)}">${lead(r.m, r)}${r.win != null ? " · " + pc(r.win) : ""}</b>`;
  if (r.basis === "fundamentals") h += `<span></span><b style="font-family:var(--sans);color:var(--faint)">no polls: fundamentals model</b>`;
  if (L.c != null) h += `<span>Count read (${L.src === "v1" ? "county by county" : "late shift applied"})</span><b class="${cls(L.c)}">${lead(L.c, r)} ± ${L.csd.toFixed(1)}</b>`;
  if (L.ou != null) h += `<span>Over/under vs model</span><b class="${cls(L.ou)}">${sgn(L.ou)} pts</b>`;
  if (L.mu != null) {
    h += `<i class="gap"></i><span>Projected final</span><b class="${cls(L.mu)}">${lead(L.mu, r)}</b>`;
    h += `<span>80% band</span><b>${lead(L.mu - 1.2816 * L.sd, r)} to ${lead(L.mu + 1.2816 * L.sd, r)}</b>`;
    h += `<span>Projection shift</span><b class="${cls(L.sh)}">${sgn(L.sh)} pts</b>`;
    h += `<span>Our chance</span><b><span class="pos">${esc(r.dl)} ${pc(L.p)}</span> · <span class="neg">${esc(r.rl)} ${pc(1 - L.p)}</span></b>`;
  }
  if (L.k) {
    h += `<i class="gap"></i>`;
    for (const sd of ["D", "R"]) if (L.k[sd]) h += `<span>Kalshi ${esc(sideName(r, sd))}</span><b>${cents(L.k[sd].bid)} bid · ${cents(L.k[sd].ask)} to buy</b>`;
    if (L.best) h += `<span>Best buy</span><b class="${L.best.edge > 0 ? "pos" : ""}">${esc(sideName(r, L.best.side))} at ${cents(L.best.ask)}: ${L.best.edge >= 0 ? "+" : "−"}${(100 * Math.abs(L.best.edge)).toFixed(1)}¢${L.best.upto ? " · pay up to " + cents(L.best.upto) : ""}</b>`;
  }
  h += `</div>`;
  if (full) h += outList(r, 4);
  if (L.best && full) {
    h += `<div class="kfoot">${esc(L.best.how)} · fee ${cents(L.best.fee)}${whyTags(r).map(([c, t]) => `<br><span class="${c === "warn" ? "err" : ""}">${esc(t)}</span>`).join("")}</div>`;
  }
  if (full) {
    const hs = HIST[r.id] || [];
    if (hs.length > 1) {
      const pts = hs.map(x => ({ t: x[0], pct: x[1], m: x[2], mu: x[3], p: x[4] == null ? null : 100 * x[4], ka: x[5] == null ? null : 100 * x[5] }));
      const ser = [{ k: "p", color: "#4a90e8", label: "Our chance (" + esc(r.dl) + ")" }];
      if (pts.some(p => p.ka != null)) ser.push({ k: "ka", color: "#e2b84f", label: "Kalshi " + esc(r.dl) + " (ask)" });
      h += `<div class="note">${esc(r.dl)}'s chance through the night</div>` + chart(pts, ser, [0, 100], v => v + "%", 50);
      const vals = pts.flatMap(p => [p.m, p.mu]).filter(v => v != null);
      const lo = Math.max(-60, Math.floor(Math.min(-5, ...vals, r.m) / 5) * 5), hi = Math.min(60, Math.ceil(Math.max(5, ...vals, r.m) / 5) * 5);
      h += `<div class="note">Margin, points (+ = ${esc(r.dl)} ahead)</div>` + chart(pts, [{ k: "mu", color: "#4a90e8", label: "Projected final" }, { k: "m", color: "#c9d1dc", label: "Margin so far" }], [lo, hi], v => (v > 0 ? "+" : "") + v, 0, r.m);
    }
    const own = (B.lean[r.st] || []).some(x => x[0] !== 0);
    if (L.src === "v1") h += `<div class="fine">County by county (the desk's projector v1): each county's counted votes against its 2024 presidential lean give the district's swing; the votes still out in each county are projected at its lean plus that swing (and part of its own deviation once it has counted), started from our model (± ${B.model_sd} pts). From NYT's district file, with each county's expected vote. A county split between districts uses the whole county's 2024 lean.</div>`;
    else h += `<div class="fine">Count read: the margin so far plus the votes still out moving ${own ? `the way ${esc(r.st)}'s late votes moved in 2020–24 statewide races` : `with no lean (we have no ${esc(r.st)} count history; the spread is all states')`}, as the desk's v0. Projection: that read and our model (± ${B.model_sd} pts) combined by how sure each is. A district's count can run differently from its state's.</div>`;
  }
  return h;
}

function chart(pts, series, yr, fmtY, mid, ref) {
  const W = 480, H = 120, l = 30, rr = 6, t = 6, b = 18;
  const ts = pts.map(p => Date.parse(p.t)), t0 = ts[0], t1 = Math.max(ts[ts.length - 1], t0 + 60000);
  const X = v => l + (W - l - rr) * (v - t0) / (t1 - t0), Y = v => t + (H - t - b) * (1 - (Math.max(yr[0], Math.min(yr[1], v)) - yr[0]) / (yr[1] - yr[0]));
  let g = "", ticks = [];
  const st = yr[1] - yr[0] > 60 ? 25 : yr[1] - yr[0] > 24 ? 10 : 5;
  for (let v = Math.ceil(yr[0] / st) * st; v <= yr[1]; v += st) ticks.push(v);
  for (const v of ticks) g += `<line x1="${l}" x2="${W - rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === mid ? "#46536a" : "#212a37"}"/><text x="${l - 4}" y="${Y(v) + 3}" text-anchor="end">${fmtY(v)}</text>`;
  if (ref != null) g += `<line x1="${l}" x2="${W - rr}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="#8e99aa" stroke-dasharray="3 3"/>`;
  const fmtT = v => new Date(v).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
  g += `<text x="${l}" y="${H - 4}">${fmtT(t0)}</text><text x="${W - rr}" y="${H - 4}" text-anchor="end">${fmtT(t1)}</text>`;
  for (const s of series) {
    let d = "", pen = false;
    for (const p of pts) { if (p[s.k] == null) { pen = false; continue; } d += (pen ? "L" : "M") + X(Date.parse(p.t)).toFixed(1) + "," + Y(p[s.k]).toFixed(1); pen = true; }
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="clegend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}${ref != null ? `<span><i style="background:#8e99aa"></i>Our model (dashed)</span>` : ""}</div>`;
}

// ---------- side panel ----------
const COLS = [
  ["race", "Race", r => r.k], ["pct", "Counted", r => r.L.pct], ["m", "Margin", r => r.L.m], ["model", "Model", r => r.m],
  ["mu", "Projected", r => r.L.mu], ["p", "Chance (D)", r => r.L.p], ["ka", "Kalshi D", r => r.L.k && r.L.k.D ? r.L.k.D.ask : null],
  ["edge", "Edge", r => r.L.best ? r.L.best.edge : null], ["ou", "Over/under", r => r.L.ou], ["sh", "Shift", r => r.L.sh]];
function sorted(rs) {
  if (ui.sort === "default") {   // the closest projected races first, then by counted
    return rs.slice().sort((a, b) => (a.L.p == null ? 9 : Math.abs(a.L.p - 0.5)) - (b.L.p == null ? 9 : Math.abs(b.L.p - 0.5)) || (b.L.pct || 0) - (a.L.pct || 0));
  }
  const f = COLS.find(c => c[0] === ui.sort)[2];
  return rs.slice().sort((a, b) => { const x = f(a), y = f(b); if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * ui.dir; });
}
function board(rs) {
  // sort (user 2026-11-03: "make it so I can sort by edge"): click a heading; "Buy on Kalshi" = FLIPs first, then
  // picks with the count, then the rest, by edge
  const BKEY = { edge: r => r.L.best.edge, ask: r => r.L.best.ask, ours: r => r.L.best.ours, upto: r => r.L.best.upto,
                 pct: r => r.L.pct };
  const list = rs.filter(r => r.L.best && r.L.best.edge >= 0.03).sort(ui.bsort === "flip"
    ? (a, b) => (b.L.best.flip - a.L.best.flip) || (a.L.best.against - b.L.best.against) || (!a.L.pct - !b.L.pct) || (b.L.best.edge - a.L.best.edge)
    : (a, b) => { const x = BKEY[ui.bsort](a), y = BKEY[ui.bsort](b); if (x == null) return 1; if (y == null) return -1; return (x - y) * ui.bdir; });
  const nk = rs.filter(r => r.L.k).length;
  let h = `<div class="board"><h4>Kalshi board<small>${list.length} House races 3¢+ off our projection after the fee · ${nk} with live Kalshi prices · ${list.filter(r => r.L.best.flip).length} FLIP</small></h4>`;
  if (!list.length) return h + `<span class="note">Nothing 3¢+ off right now.</span></div>`;
  const bth = (k, lab) => `<th data-bsort="${k}" ${ui.bsort === k ? `aria-sort="${ui.bdir > 0 ? "ascending" : "descending"}"` : ""}>${lab}${ui.bsort === k && k !== "flip" ? (ui.bdir > 0 ? " ▲" : " ▼") : ""}</th>`;
  h += `<table><thead><tr>${bth("flip", "Buy on Kalshi")}${bth("pct", "Counted")}${bth("ask", "Ask")}${bth("ours", "Ours")}${bth("edge", "Edge")}${bth("upto", "Pay up to")}</tr></thead><tbody>`;
  for (const r of list.slice(0, 40)) {
    const b = r.L.best, tags = whyTags(r);
    h += `<tr data-id="${r.id}"><td class="buy"><b class="${b.side === "D" ? "pos" : "neg"}">${esc(sideName(r, b.side))}</b> ${esc(b.how.startsWith("NO") ? "(NO on " + sideName(r, b.side === "D" ? "R" : "D") + ")" : "YES")}${b.flip ? '<span class="flipb">FLIP</span>' : ""}` +
      `<div class="why">${esc(r.k)} · ${r.L.pct ? r.L.pct.toFixed(0) + "% counted · " + lead(r.L.m, r) + " so far" : "not counting yet"}</div>` +
      tags.filter(t => !b.flip || t[0] === "warn").map(([c, t]) => `<div class="why ${c}">${esc(t)}</div>`).join("") + `</td>` +
      `<td>${r.L.pct ? r.L.pct.toFixed(0) + "%" : "–"}</td><td>${cents(b.ask)}</td><td>${pc(b.ours)}</td><td class="pos">+${(100 * b.edge).toFixed(0)}¢</td><td>${b.upto ? cents(b.upto) : "–"}</td></tr>`;
  }
  h += `</tbody></table><p class="kfoot" style="margin:0">Click a heading to sort (again to reverse); "Buy on Kalshi" puts FLIPs first, then picks with the count, then the rest, by edge. Edge = our chance − ask − Kalshi's taker fee, per $1 contract; pay up to = the highest ask still 3¢+ after the fee. Counting House races run county by county from NYT's district files (the desk's v1); where a district's counties don't line up it falls back to the district total (tagged). Check the live book before buying: prices move in seconds after a vote dump. Kalshi prices: every 60 s.</p></div>`;
  return h;
}

// ---------- cards (user 2026-11-03: "cards like the election night desk in another tab ... sort the cards on the
// updates by edge"): one card per race, re-sorted on every update ----------
function bar(r) {
  const L = r.L, W = 300, H = 40, x0 = 12, x1 = W - 12;
  const vals = [L.mu, L.m, r.m, L.mu != null ? L.mu - 1.2816 * L.sd : null, L.mu != null ? L.mu + 1.2816 * L.sd : null].filter(v => v != null);
  const span = Math.min(40, Math.max(15, Math.ceil(Math.max(...vals.map(Math.abs), 0) / 5) * 5));
  const X = v => x0 + (x1 - x0) * (Math.max(-span, Math.min(span, v)) + span) / (2 * span);
  let g = `<rect x="${x0}" y="14" width="${(x1 - x0) / 2}" height="8" rx="3" fill="rgba(232,102,95,.22)"/><rect x="${X(0)}" y="14" width="${(x1 - x0) / 2}" height="8" rx="3" fill="rgba(74,144,232,.22)"/>`;
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="10" y2="26" stroke="#5d687a"/>`;
  if (r.m != null) g += `<line x1="${X(r.m)}" x2="${X(r.m)}" y1="8" y2="28" stroke="#e2b84f" stroke-dasharray="2 2" stroke-width="1.5"/>`;
  if (L.mu != null) {
    const a = X(L.mu - 1.2816 * L.sd), b = X(L.mu + 1.2816 * L.sd);
    g += `<rect x="${a}" y="13" width="${Math.max(2, b - a)}" height="10" rx="4" fill="rgba(180,138,230,.45)"/><circle cx="${X(L.mu)}" cy="18" r="5" fill="#cbb2f2" stroke="#131922" stroke-width="1.5"/>`;
  }
  if (L.m != null) g += `<path d="M${X(L.m) - 5},4 L${X(L.m) + 5},4 L${X(L.m)},10 Z" fill="#e7ebf1"/>`;
  g += `<text x="${x0}" y="38">${esc(r.rl || "R")} +${span}</text><text x="${x1}" y="38" text-anchor="end">${esc(r.dl || "D")} +${span}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Projected margin with its 80% band (purple), the margin so far (white triangle) and our model (dashed)">${g}</svg>`;
}

function outList(r, n) {
  const o = r.L.out || [];
  if (!o.length) return r.L.src === "v1" && r.L.pct < 99.5 ? `<div class="outl"><span class="h">Still out</span><span>no county with 3%+ of the district's vote left</span></div>` : "";
  return `<div class="outl"><span class="h">Biggest counties still out</span>` + o.slice(0, n).map(c =>
    `<span><b>${esc(c.n)}</b> ${c.pct}% counted · ~${fmtInt(c.left)} left (${c.sh}% of the district) · 2024 ${c.m24 >= 0 ? "D" : "R"}+${Math.abs(c.m24).toFixed(0)} · ` +
    `rest expected <span class="${c.exp >= 0 ? "pos" : "neg"}">${c.exp >= 0 ? esc(r.dl) : esc(r.rl)} +${Math.abs(c.exp).toFixed(0)}</span></span>`).join("") + `</div>`;
}
const srcLabel = r => r.L.src === "v1" ? `county by county (${r.L.nu} ${r.st === "ME" || r.st === "CT" || r.st === "MA" || r.st === "NH" || r.st === "VT" || r.st === "RI" ? "towns" : "counties"})` : r.L.src === "v0" ? "district total only" : "from our model";

function raceCard(r) {
  const L = r.L, b = L.best;
  const chip = L.call ? `<span class="chip ${L.call === "D" ? "callD" : L.call === "R" ? "callR" : "done"}">CALLED · ${esc(L.call === "D" ? r.dl : L.call === "R" ? r.rl : L.call)}</span>`
    : L.pct == null || !L.v ? `<span class="chip">NOT REPORTING</span>`
    : `<span class="chip ${L.pct >= 95 ? "done" : "live"}">${L.pct >= 95 ? "NEARLY DONE" : "COUNTING"} · ${L.pct.toFixed(0)}%</span>`;
  let h = `<div class="rc ${b && b.flip ? "flipc" : b && b.edge >= 0.03 ? "edgec" : ""}" data-id="${r.id}">`;
  h += `<div class="top"><b>${esc(short(r))}${b && b.flip ? '<span class="flipb">FLIP</span>' : ""}</b>${chip}</div>`;
  h += `<div class="names"><span class="pos">${esc(r.d || "–")}</span><span class="neg">${esc(r.r || "–")}</span></div>`;
  if (r.kind !== "ok") {
    h += `<div class="note">${r.kind === "jungle" ? "Louisiana's Nov 3 round (runoff Dec 12)" + (L.lead ? ": " + esc(L.lead) + " leads" : "") : r.kind === "same-party" ? "Same-party race: no projection" : "Uncontested"}</div></div>`;
    return h;
  }
  h += bar(r);
  const lo = L.mu != null ? L.mu - 1.2816 * L.sd : null, hi = L.mu != null ? L.mu + 1.2816 * L.sd : null;
  const fav = L.p == null ? null : L.p >= 0.5 ? "D" : "R", fp = L.p == null ? null : Math.max(L.p, 1 - L.p);
  h += `<div class="big2"><div><small>Projected final</small><b class="${cls(L.mu ?? r.m)}">${lead(L.mu ?? r.m, r)}</b></div>` +
    `<div class="r"><small>Win chance</small><b class="${fav === "D" ? "pos" : "neg"}">${fav ? esc(sideName(r, fav)) + " " + (fp > 0.995 ? ">99%" : (100 * fp).toFixed(0) + "%") : "–"}</b></div></div>`;
  h += `<div class="sub2"><span>${L.mu != null ? "80%: " + lead(lo, r) + " to " + lead(hi, r) : ""}</span><span>${L.c != null ? srcLabel(r) : "from our model"}</span></div>`;
  const left = L.pct > 0 && L.pct < 100 ? L.v * (100 / L.pct) - L.v : 0;
  h += `<div class="kv2"><span>On screen</span><b class="${cls(L.m)}">${lead(L.m, r)}</b><span>Votes counted</span><b>${fmtInt(L.v)}</b>` +
    `<span>Our model</span><b class="${cls(r.m)}">${lead(r.m, r)}</b><span>Votes left (est.)</span><b>${L.pct ? fmtInt(left) : "–"}</b>` +
    `<span>Count read</span><b class="${cls(L.c)}">${L.c != null ? lead(L.c, r) : "–"}</b><span>Model win</span><b>${r.win != null ? esc(r.dl) + " " + pc(r.win) : "–"}</b></div>`;
  h += outList(r, 2);
  if (L.k) {
    h += `<div class="kbox">`;
    for (const sd of ["D", "R"]) if (L.k[sd]) h += `<div class="row"><span class="${sd === "D" ? "pos" : "neg"}">Kalshi ${esc(sideName(r, sd))}</span><b>${cents(L.k[sd].bid)} / ${cents(L.k[sd].ask)}</b><span class="note">ours ${pc(sd === "D" ? L.p : 1 - L.p)}</span></div>`;
    if (b) {
      const tags = whyTags(r).filter(t => t[0] === "warn");
      h += b.edge >= 0.03
        ? `<div class="buyl ${b.flip ? "flipl" : ""}">Buy <b class="${b.side === "D" ? "pos" : "neg"}">${esc(sideName(r, b.side))}</b> ${b.how.startsWith("NO") ? "(NO on " + esc(sideName(r, b.side === "D" ? "R" : "D")) + ")" : "YES"} at ${cents(b.ask)} · edge <b class="pos">+${(100 * b.edge).toFixed(1)}¢</b>${b.upto ? " · pay up to " + cents(b.upto) : ""}</div>`
        : `<div class="note">No edge: best is ${esc(sideName(r, b.side))} at ${cents(b.ask)} (${b.edge >= 0 ? "+" : "−"}${(100 * Math.abs(b.edge)).toFixed(1)}¢ after fee)</div>`;
      if (b.edge >= 0.03) h += tags.map(([, t]) => `<div class="tag">${esc(t)}</div>`).join("");
    }
    h += `</div>`;
  } else if (r.office === "H") h += `<div class="note">No live Kalshi market</div>`;
  if (L.ou != null) h += `<div class="ovr">${esc(L.ou >= 0 ? r.dl : r.rl)} running <b>${Math.abs(L.ou).toFixed(1)} pts over</b> our model (count read vs model)</div>`;
  return h + `</div>`;
}

function alerts(rs) {
  const go = r => `<a data-go="${r.id}">${esc(short(r))}</a>`;
  const lc = rs.filter(r => !r.L.call && r.L.mu != null && r.L.m != null && r.L.pct >= 20 && Math.abs(r.L.mu) >= 0.5 && Math.abs(r.L.m) >= 0.1 && (r.L.mu > 0) !== (r.L.m > 0))
    .sort((a, b) => Math.abs(b.L.p - 0.5) - Math.abs(a.L.p - 0.5));
  const fl = rs.filter(r => r.L.best && r.L.best.flip);
  let h = "";
  if (fl.length) h += `<div class="alert flipa"><span class="lab">FLIP</span><div class="items">${fl.map(r => `${go(r)}: buy ${esc(sideName(r, r.L.best.side))} at ${cents(r.L.best.ask)}, ours ${pc(r.L.best.ours)}, +${(100 * r.L.best.edge).toFixed(0)}¢ (${r.L.pct.toFixed(0)}% counted, ${lead(r.L.m, r)} so far)`).join(" · ")}</div></div>`;
  if (lc.length) h += `<div class="alert"><span class="lab">LEAD CHANGE</span><div class="items">${lc.map(r => `${go(r)}: ${lead(r.L.m, r)} on screen, projected ${lead(r.L.mu, r)} (${pc(r.L.mu > 0 ? r.L.p : 1 - r.L.p)}) at ${r.L.pct.toFixed(0)}% counted`).join(" · ")}</div></div>`;
  return h;
}

function renderCards(rs) {
  const vis = visible(rs), E = r => r.L.best ? r.L.best.edge : -9;
  const by = {
    edge: (a, b) => E(b) - E(a),
    flip: (a, b) => ((b.L.best && b.L.best.flip) - (a.L.best && a.L.best.flip)) || E(b) - E(a),
    close: (a, b) => (a.L.p == null ? 9 : Math.abs(a.L.p - 0.5)) - (b.L.p == null ? 9 : Math.abs(b.L.p - 0.5)),
    pct: (a, b) => (b.L.pct || 0) - (a.L.pct || 0),
    sh: (a, b) => Math.abs(b.L.sh || 0) - Math.abs(a.L.sh || 0),
  }[ui.csort];
  const list = vis.slice().sort((a, b) => by(a, b) || (b.L.pct || 0) - (a.L.pct || 0));
  const nEdge = list.filter(r => r.L.best && r.L.best.edge >= 0.03).length;
  document.getElementById("cnote").textContent = `${list.length} ${OFF[ui.office]} races · ${nEdge} with a Kalshi edge 3¢+ · re-sorted every update · click a card for its map and charts` +
    (ui.office === "H" ? "" : " · Kalshi prices are on the House races (Senate and Governor prices: the data desk)");
  document.getElementById("cgrid").innerHTML = list.map(raceCard).join("");
  document.getElementById("alerts").innerHTML = alerts(rs);
  const cb = document.getElementById("cboard"), keep = cb.querySelector(".board") ? cb.querySelector(".board").scrollTop : 0;
  cb.innerHTML = ui.board && ui.office === "H" ? board(rs) : "";
  if (cb.querySelector(".board")) cb.querySelector(".board").scrollTop = keep;     // the update doesn't jump the list
}

function renderSide(rs) {
  let h = "";
  const sel = ui.sel && rs.find(r => r.id === ui.sel);
  if (sel) h += `<div class="detail ctip"><div><button class="x" data-close>×</button></div>${card(sel, true)}</div>`;
  if (ui.board && ui.office === "H") h += board(rs);
  const vis = sorted(visible(rs));
  h += `<div class="note">${vis.length} of ${rs.length} ${OFF[ui.office]} races. Click a row or the map for detail. Sorted ${ui.sort === "default" ? "closest projection first" : "by " + COLS.find(c => c[0] === ui.sort)[1]}; click a heading to sort.</div>`;
  h += `<table><thead><tr>${COLS.map(c => `<th data-sort="${c[0]}" ${ui.sort === c[0] ? `aria-sort="${ui.dir > 0 ? "ascending" : "descending"}"` : ""}>${c[1]}</th>`).join("")}</tr></thead><tbody>`;
  for (const r of vis) {
    const L = r.L;
    h += `<tr data-id="${r.id}" class="${r.id === ui.sel ? "sel" : ""}"><td>${esc(short(r))}${L.call ? ` <span class="called ${L.call === "D" ? "pos" : L.call === "R" ? "neg" : ""}">${L.call === "D" || L.call === "R" ? L.call : "✓"}</span>` : ""}</td>` +
      `<td>${L.pct == null ? "–" : L.pct.toFixed(0) + "%"}</td><td class="${cls(L.m)}">${L.m == null ? "–" : (L.m > 0 ? "D+" : "R+") + Math.abs(L.m).toFixed(1)}</td>` +
      `<td class="${cls(r.m)}">${r.m == null ? "–" : (r.m > 0 ? "D+" : "R+") + Math.abs(r.m).toFixed(1)}</td>` +
      `<td class="${cls(L.mu)}">${L.mu == null ? "–" : (L.mu > 0 ? "D+" : "R+") + Math.abs(L.mu).toFixed(1)}</td><td>${pc(L.p)}</td>` +
      `<td>${L.k && L.k.D ? cents(L.k.D.ask) : "–"}</td>` +
      `<td class="${L.best && L.best.edge >= 0.03 ? (L.best.side === "D" ? "pos" : "neg") : ""}" style="${L.best && L.best.edge < 0.03 ? "color:var(--faint)" : ""}">${L.best ? L.best.side + " " + (L.best.edge >= 0 ? "+" : "−") + (100 * Math.abs(L.best.edge)).toFixed(0) + "¢" : "–"}${L.best && L.best.flip ? '<span class="flipb">FLIP</span>' : ""}</td>` +
      `<td class="${cls(L.ou)}">${sgn(L.ou)}</td><td class="${cls(L.sh)}">${sgn(L.sh)}</td></tr>`;
  }
  h += `</tbody></table><p class="fine" style="margin:0">Race: a check = called by NYT. Counted: NYT's share of the expected vote. Margin: D (or the non-Republican) minus R so far, points of all votes. Model: our margin model's forecast before the count (fundamentals model where a race had no polls). Projected: our final-margin projection now. Chance (D): its chance the Democrat/non-Republican wins. Over/under: the count read (the margin so far with the state's usual late shift on the votes still out) minus the model, + = the Democrat ahead of it. Shift: projected minus model, the over/under weighed by how sure the count read is. Kalshi D: the cheapest way to buy the Democrat / non-Republican (YES on it or NO on the Republican). Edge: the better of the two sides, our chance − ask − Kalshi's fee, per $1 contract (D or R = the side). Separate from the data desk.</p>`;
  document.getElementById("side").innerHTML = h;
}

function renderSummary(all) {
  let h = "";
  for (const o of ["H", "S", "G"]) {
    const rs = all.filter(r => r.office === o);
    let cd = 0, cr = 0, exp = 0;
    for (const r of rs) {
      const L = r.L;
      if (L.call === "D") cd++; else if (L.call === "R") cr++;
      if (L.call === "D") exp += 1; else if (L.call === "R") exp += 0;
      else if (L.p != null) exp += L.p;
      else if (r.kind === "same-party" || r.kind === "uncontested") exp += r.dp && !r.r ? 1 : (r.r && !r.d ? 0 : (r.dp === "DEM" ? 1 : 0));
      else if (r.win != null) exp += r.win;
    }
    h += `<div>${OFF[o]} (${rs.length} up): called <b class="pos">D ${cd}</b> <b class="neg">R ${cr}</b> · expected D seats from our projections <b>${exp.toFixed(1)}</b></div>`;
  }
  document.getElementById("summary").innerHTML = h;
}

// ---------- map ----------
function layers(rs) {
  const L = window.deck, polys = [], cols = [];
  for (const r of rs) for (const ring of shapeOf(r)) polys.push({ ring, r });
  for (const r of visible(rs)) { const v = metricOf(r), pos = posOf(r); if (v != null && pos && (r.L.v > 0 || ui.metric === "ke")) cols.push({ r, v, pos }); }
  const maxAbs = ui.metric === "p" ? 50 : Math.max(FULL[ui.metric] * 1.5, ...cols.map(c => Math.min(Math.abs(c.v), FULL[ui.metric] * 3)));
  const size = FIT ? FIT.size : 900, H = size * (ui.office === "H" ? 0.12 : 0.2), radius = ui.office === "H" ? size / 330 : size / 120;
  const vis = new Set(visible(rs).map(r => r.id));
  const out = [
    new L.PolygonLayer({ id: "shapes", data: polys, getPolygon: d => d.ring, pickable: true, stroked: true, filled: true,
      getFillColor: d => { const c = fill(d.r); return vis.has(d.r.id) ? c : [c[0], c[1], c[2], 60]; },
      getLineColor: d => d.r.id === ui.sel ? [240, 244, 250, 255] : [12, 16, 22, 255], lineWidthUnits: "pixels",
      getLineWidth: d => d.r.id === ui.sel ? 2.5 : 0.4,
      updateTriggers: { getFillColor: [LIVE && LIVE.generated, ui.metric, ui.filter, ui.q, ui.office], getLineColor: [ui.sel], getLineWidth: [ui.sel] } }),
    new L.PathLayer({ id: "states", data: ui.office === "H" ? ALL_RINGS : [], getPath: d => d.concat([d[0]]), getColor: [150, 160, 178, 160], widthUnits: "pixels", getWidth: 1 }),
    new L.ColumnLayer({ id: "cols", data: cols, diskResolution: 10, radius, extruded: true, pickable: true,
      getPosition: c => c.pos, getElevation: c => Math.min(Math.abs(c.v), maxAbs) / maxAbs * H,
      getFillColor: c => c.v >= 0 ? [...C_D, 235] : [...C_R, 235], material: { ambient: 0.45, diffuse: 0.6, shininess: 24 },
      updateTriggers: { getElevation: [LIVE && LIVE.generated, ui.metric, ui.office, maxAbs], getFillColor: [LIVE && LIVE.generated, ui.metric] } }),
  ];
  return out;
}
function tooltip({ object }) {
  if (!object) return null;
  const r = object.r;
  return { html: `<div class="ctip">${card(r, false)}</div>`, style: { background: "#131922", color: "#e7ebf1", border: "1px solid #2f3a4a", borderRadius: "6px", padding: "9px 11px", width: "330px" } };
}
function flyTo(view) { DECK.setProps({ initialViewState: { ...view, minZoom: -3, maxZoom: 9, transitionDuration: 600 } }); }

function render(refit) {
  const lv = Object.fromEntries(((LIVE && LIVE.races) || []).map(x => [x.id, x]));
  const all = B.races.map(r => ({ ...r, L: lv[r.id] || {} }));
  const rs = all.filter(r => r.office === ui.office);
  document.getElementById("offices").innerHTML = Object.entries(OFF).map(([k, v]) => `<button data-office="${k}" aria-pressed="${ui.office === k}">${v}</button>`).join("");
  const full = ui.metric === "p" ? null : FULL[ui.metric];
  document.getElementById("legend").innerHTML = ui.metric === "ke"
    ? `<span><i style="background:rgb(${C_R})"></i>buy the Republican (edge ${FULL.ke}¢+)</span><span><i style="background:rgb(64,70,84)"></i>no edge</span><span><i style="background:rgb(${C_D})"></i>buy the Democrat / non-Republican (${FULL.ke}¢+)</span><span><i style="background:rgb(34,41,52)"></i>no Kalshi price / not reporting</span><span>House only · edge after Kalshi's fee</span>`
    : ui.metric === "p"
    ? `<span><i style="background:rgb(${C_R})"></i>Republican likely</span><span><i style="background:rgb(64,70,84)"></i>toss-up</span><span><i style="background:rgb(${C_D})"></i>Democrat / non-Republican likely</span><span><i style="background:rgb(34,41,52)"></i>not reporting</span><span>Faded: little counted · columns: chance minus 50%</span>`
    : `<span><i style="background:rgb(${C_R})"></i>Republican ahead of our model (${full}+ pts)</span><span><i style="background:rgb(64,70,84)"></i>as expected</span><span><i style="background:rgb(${C_D})"></i>Democrat / non-Republican ahead (${full}+ pts)</span><span><i style="background:rgb(34,41,52)"></i>not reporting</span><span>Faded: little counted · drag to rotate, scroll to zoom, click for detail</span>`;
  renderSummary(all);
  document.getElementById("views").innerHTML = [["cards", "Cards"], ["map", "Map &amp; table"]].map(([k, v]) => `<button data-view="${k}" aria-pressed="${ui.view === k}">${v}</button>`).join("");
  document.querySelector("main").hidden = ui.view !== "map";
  document.getElementById("legend").hidden = ui.view !== "map";
  document.getElementById("cardsview").hidden = ui.view !== "cards";
  const age = LIVE ? Math.round((Date.now() - genOf(LIVE)) / 1000) : null;
  document.getElementById("status").innerHTML = lastErr && !LIVE ? `<span class="err">${esc(lastErr)}</span>` : LIVE ?
    `data <b>${etTime(new Date(genOf(LIVE)))}</b> <span class="${age > 180 ? "err" : ""}">(${age > 180 ? "stale, " + Math.round(age / 60) + " min" : age + " s ago"})</span> · ${LIVE.states_ok}/${LIVE.states} states` : "loading…";
  const ages = LIVE ? Math.round((Date.now() - genOf(LIVE)) / 60000) : null;
  document.getElementById("agec").innerHTML = `NYT <b>${ages == null ? "–" : ages < 1 ? "<1m" : ages + "m"}</b>`;
  document.getElementById("agek").innerHTML = `Kalshi <b>${ages == null || !(LIVE.races || []).some(x => x.k) ? "–" : ages < 1 ? "<1m" : ages + "m"}</b>`;
  document.getElementById("liveb").className = "liveb" + (ages != null && ages >= 3 ? " stale" : "");
  document.getElementById("liveb").textContent = ages != null && ages >= 3 ? "STALE" : "LIVE";
  if (ui.view === "cards") { renderCards(rs); return; }     // the map is built when its tab first opens
  renderSide(rs);
  if (!FIT || refit) FIT = viewFor(ALL_RINGS, ui.office === "H" ? 35 : 40);
  if (!DECK) {
    DECK = new window.deck.Deck({ parent: document.getElementById("deckmap"), views: new window.deck.OrbitView({ orbitAxis: "Z", fovy: 35 }),
      initialViewState: { ...FIT, minZoom: -3, maxZoom: 9 }, controller: true, layers: layers(rs), getTooltip: tooltip,
      onClick: ({ object }) => { if (object) select(object.r.id, true); } });
  } else DECK.setProps({ layers: layers(rs) });
}
function select(id, zoom) {
  ui.sel = id;
  const r = BY[id];
  if (r && r.office !== ui.office) ui.office = r.office;
  render(false);
  if (zoom && r) flyTo(r.office === "H" ? viewFor(shapeOf(r).length ? shapeOf(r) : ALL_RINGS, 45) : viewFor(G.states[r.st] || ALL_RINGS, 45));
}

document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (b) { ui.view = b.dataset.view; render(!DECK); if (ui.view === "map" && DECK) { DECK.redraw(true); } }
});
document.getElementById("csort").addEventListener("change", e => { ui.csort = e.target.value; render(false); });
document.getElementById("cgrid").addEventListener("click", e => {
  const c = e.target.closest(".rc[data-id]");
  if (c) { openRace(c.dataset.id); }
});
function openRace(id) { const first = !DECK; ui.view = "map"; if (first) render(true); select(id, true); window.scrollTo(0, 0); }
document.getElementById("cardsview").addEventListener("click", e => {
  const bt = e.target.closest("th[data-bsort]");
  if (bt) { const k = bt.dataset.bsort; if (ui.bsort === k && k !== "flip") ui.bdir = -ui.bdir; else { ui.bsort = k; ui.bdir = k === "ask" || k === "pct" ? 1 : -1; } render(false); return; }
  const a = e.target.closest("[data-go]");
  if (a) { openRace(a.dataset.go); return; }
  const tr = e.target.closest("#cboard tr[data-id]");
  if (tr) openRace(tr.dataset.id);
});
document.getElementById("offices").addEventListener("click", e => { const b = e.target.closest("button[data-office]"); if (b) { ui.office = b.dataset.office; ui.sel = null; render(false); flyTo(FIT); } });
document.getElementById("metric").addEventListener("change", e => { ui.metric = e.target.value; render(false); });
document.getElementById("filter").addEventListener("change", e => { ui.filter = e.target.value; render(false); });
document.getElementById("q").addEventListener("input", e => { ui.q = e.target.value; render(false); });
document.getElementById("board").addEventListener("change", e => { ui.board = e.target.checked; render(false); });
document.getElementById("side").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { ui.sel = null; render(false); flyTo(FIT); return; }
  const bt = e.target.closest("th[data-bsort]");
  if (bt) { const k = bt.dataset.bsort; if (ui.bsort === k && k !== "flip") ui.bdir = -ui.bdir; else { ui.bsort = k; ui.bdir = k === "ask" || k === "pct" ? 1 : -1; } render(false); return; }
  const th = e.target.closest("th[data-sort]");
  if (th) { const k = th.dataset.sort; if (ui.sort === k) ui.dir = -ui.dir; else { ui.sort = k; ui.dir = k === "race" ? 1 : -1; } render(false); return; }
  const tr = e.target.closest("tr[data-id]");
  if (tr) { select(tr.dataset.id, true); document.getElementById("side").scrollTop = 0; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sel) { ui.sel = null; render(false); flyTo(FIT); } });
window.addEventListener("resize", () => { if (DECK) { FIT = viewFor(ALL_RINGS, ui.office === "H" ? 35 : 40); } });
render(true);
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
